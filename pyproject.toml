[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowblueprint"
version = "0.2.0a0"
description = "The Python architect: turn scripts, Jupyter notebooks and whole projects into architecture diagrams (draw.io, SVG, HTML, Mermaid) with inputs, outputs, dtypes, loops and decisions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sambit Supriya Dash"}]
keywords = ["python", "architecture", "architecture-generator", "archgen", "code-to-flowchart", "flowchart", "diagram", "drawio", "block-diagram", "script-to-architecture", "notebook-to-architecture", "workflow-diagram", "code-visualization", "mermaid", "project-architecture", "dependency-diagram", "documentation", "data-pipeline", "jupyter", "static-analysis", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["funcloom>=0.10.3a0,<0.11", "refactrail>=0.4.0a0,<0.5"]

[project.optional-dependencies]
release = ["build>=1.2,<2", "setuptools>=77", "twine>=6,<7"]

[project.scripts]
flowblueprint = "flowblueprint.cli:main"

[project.urls]
Homepage = "https://github.com/SAMtheROCKET/flowblueprint"
Repository = "https://github.com/SAMtheROCKET/flowblueprint"
Issues = "https://github.com/SAMtheROCKET/flowblueprint/issues"

[tool.setuptools.packages.find]
where = ["src"]
