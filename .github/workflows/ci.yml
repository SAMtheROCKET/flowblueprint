name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[release]"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: RefacTrail profile and correctness checks
        shell: bash
        run: |
          python -m refactrail check src
          python -m refactrail lint src tests
      - name: Build and check the packages
        shell: bash
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and draw the example
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -x "$RUNNER_TEMP/clean/bin/python" ]; then
            CLEAN="$RUNNER_TEMP/clean/bin/python"
          else
            CLEAN="$RUNNER_TEMP/clean/Scripts/python.exe"
          fi
          "$CLEAN" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$CLEAN" -m flowblueprint "$GITHUB_WORKSPACE/tests/examples/station_report.py" -o check.drawio
          "$CLEAN" -m flowblueprint "$GITHUB_WORKSPACE/tests/examples/station_report.py" --level summary -o check.svg
          "$CLEAN" -m flowblueprint "$GITHUB_WORKSPACE/tests/examples/station_report.py" --check
          "$CLEAN" -m flowblueprint "$GITHUB_WORKSPACE/tests/examples/station_report.py" -o check.md
          "$CLEAN" -m flowblueprint "$GITHUB_WORKSPACE/tests/examples" -o overview.html
          test -s check.drawio && test -s check.svg && test -s check.md && test -s overview.html
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test editor/flowblueprint/test/runner.test.js editor/flowblueprint/test/setup.test.js
      - run: node -e "require('./editor/flowblueprint/extension.js')"
      - name: Package the extension
        run: python3 scripts/package_editor.py --extension editor/flowblueprint --output "$RUNNER_TEMP/flowblueprint.vsix"
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: draw
        uses: ./
        with:
          path: tests/examples
          output: ${{ runner.temp }}/ARCHITECTURE.md
          args: --group-depth 0
      - name: Check the action's output
        shell: bash
        run: |
          grep -q '```mermaid' "${{ steps.draw.outputs.file }}"
          grep -q 'station_report.py' "${{ steps.draw.outputs.file }}"
      - name: The check passes on the fresh diagram
        uses: ./
        with:
          path: tests/examples
          output: ${{ runner.temp }}/ARCHITECTURE.md
          args: --group-depth 0
          check: "true"
      - name: Make the diagram stale
        shell: bash
        run: echo "edited" >> "${{ runner.temp }}/ARCHITECTURE.md"
      - id: stale
        name: The check fails on the stale diagram
        continue-on-error: true
        uses: ./
        with:
          path: tests/examples
          output: ${{ runner.temp }}/ARCHITECTURE.md
          args: --group-depth 0
          check: "true"
      - name: Confirm the stale diagram was detected and left alone
        shell: bash
        run: |
          test "${{ steps.stale.outcome }}" = failure
          tail -n 1 "${{ runner.temp }}/ARCHITECTURE.md" | grep -qx edited
